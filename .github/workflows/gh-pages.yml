name: Deploy SOMNIA UI demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # CRA treats ESLint warnings as errors when CI=true; package.json disables the plugin.
      - run: npm run build
        env:
          CI: "true"
      # Publish static build to gh-pages branch (enable Pages: Settings → Pages → Deploy from branch → gh-pages / root)
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
